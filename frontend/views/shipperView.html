<section id="shipper-view" class="page">
    <header id="shipper-navbar-root"></header>

    <main class="home-shell ops-shell">
        <section class="food-header">
            <div>
                <p class="eyebrow">Shipper</p>
                <h1>Đơn cần giao</h1>
                <p class="hero-copy">Nhận đơn đã đóng gói và cập nhật trạng thái giao hàng.</p>
            </div>
            <button id="back-home-from-shipper-btn" class="btn btn--ghost">← Về trang chủ</button>
        </section>

        <div class="ops-section-stack">
            <section class="food-panel ops-panel">
                <div class="panel-head ops-panel-head">
                    <div>
                        <h3>Đơn có thể nhận</h3>
                        <p>Nhận đơn đã sẵn sàng và di chuyển đến quầy lấy hàng.</p>
                    </div>
                    <span id="shipper-available-count" class="tag">0 đơn</span>
                </div>

                <p id="shipper-available-message" class="form-message"></p>
                <div id="shipper-available-list" class="ops-order-list"></div>
            </section>

            <section class="food-panel ops-panel">
                <div class="panel-head ops-panel-head">
                    <div>
                        <h3>Đơn của tôi</h3>
                        <p>Theo dõi các đơn đang giao và cập nhật từng mốc.</p>
                    </div>
                    <span id="shipper-my-count" class="tag">0 đơn</span>
                </div>

                <p id="shipper-my-message" class="form-message"></p>
                <div id="shipper-my-list" class="ops-order-list"></div>
            </section>
        </div>
    </main>
</section>
